name: BD Acoustic Engine - Build & Artifacts

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bd-acoustic-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Compile and run the full verification suite
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          build_file="$(find . -maxdepth 4 -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/.gradle/*' | sort | head -n 1 || true)"

          if [ -z "$build_file" ]; then
            echo "::error::Gradle build file not found."
            exit 1
          fi

          project_dir="$(dirname "$build_file")"
          if [ -f "$project_dir/gradlew" ]; then
            chmod +x "$project_dir/gradlew"
            (cd "$project_dir" && ./gradlew --no-daemon clean build)
          else
            gradle --no-daemon -p "$project_dir" clean build
          fi

          jar_count="$(find "$project_dir/build/libs" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          if [ "$jar_count" -lt 1 ]; then
            echo "::error::Build completed without producing a mod JAR."
            exit 1
          fi

          while IFS= read -r jar_file; do
            unzip -t "$jar_file"
          done < <(find "$project_dir/build/libs" -maxdepth 1 -type f -name '*.jar' | sort)

          echo "status=compiled-and-tested" >> "$GITHUB_OUTPUT"

      - name: Package source and compiled outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-package
          mkdir -p artifact-package/source artifact-package/compiled

          git archive --format=tar HEAD | tar -xf - -C artifact-package/source
          find . -type f -path '*/build/libs/*.jar' -not -path './artifact-package/*' -exec cp {} artifact-package/compiled/ \; || true

          {
            echo "Project: BD Acoustic Engine"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Java: 17"
            echo "Minecraft target: 1.20.1"
            echo "Forge target: 47.4.5"
            echo "Build status: ${{ steps.compile.outputs.status || 'build-failed-or-not-run' }}"
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > artifact-package/BUILD-INFO.txt

          cd artifact-package
          zip -qr ../BD-Acoustic-Engine-source-and-build.zip .

      - name: Upload standalone mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BD-Acoustic-Engine-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload source and verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BD-Acoustic-Engine-latest
          path: BD-Acoustic-Engine-source-and-build.zip
          if-no-files-found: error
          retention-days: 90
