name: BT Acoustic Engine - Build & Artifacts

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bt-acoustic-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Compile mod when Gradle project is present
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          build_file="$(find . -maxdepth 4 -type f \\( -name build.gradle -o -name build.gradle.kts \\) -not -path '*/.gradle/*' | sort | head -n 1 || true)"

          if [ -z "$build_file" ]; then
            echo "status=source-only" >> "$GITHUB_OUTPUT"
            echo "::notice::No Gradle build file exists yet. The source snapshot will still be archived; compilation will activate when the project files are added."
            exit 0
          fi

          project_dir="$(dirname "$build_file")"
          if [ -f "$project_dir/gradlew" ]; then
            chmod +x "$project_dir/gradlew"
            (cd "$project_dir" && ./gradlew --no-daemon clean build)
          elif [ -f "$project_dir/gradlew.bat" ]; then
            echo "::error::A Windows Gradle wrapper was found, but this workflow runs on Linux. Add the Unix gradlew wrapper to enable compilation."
            exit 1
          else
            gradle --no-daemon -p "$project_dir" clean build
          fi

          echo "status=compiled" >> "$GITHUB_OUTPUT"

      - name: Package source and compiled outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-package
          mkdir -p artifact-package/source artifact-package/compiled

          git archive --format=tar HEAD | tar -xf - -C artifact-package/source

          find . -type f -path '*/build/libs/*.jar' -not -path './artifact-package/*' -exec cp {} artifact-package/compiled/ \; || true

          {
            echo "Project: BT Acoustic Engine"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Java: 17"
            echo "Minecraft target: 1.20.1"
            echo "Forge target: 47.4.5"
            echo "Build status: ${{ steps.compile.outputs.status || 'build-failed-or-not-run' }}"
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > artifact-package/BUILD-INFO.txt

          cd artifact-package
          zip -qr ../BT-Acoustic-Engine-source-and-build.zip .

      - name: Upload latest source and build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BT-Acoustic-Engine-latest
          path: BT-Acoustic-Engine-source-and-build.zip
          if-no-files-found: error
          retention-days: 90
